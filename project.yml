name: Swiftmail
options:
  bundleIdPrefix: app.swiftmail
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: QJ7KXRU547
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  SwiftmailCore:
    path: Packages/SwiftmailCore
targets:
  Swiftmail:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: App
      - path: Features
      - path: Resources/ComposeEditor
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftmailCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Swiftmail
        CFBundleName: Swiftmail
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Personal build"
        SwiftmailGoogleClientID: "$(GOOGLE_CLIENT_ID)"
        SwiftmailGoogleClientSecret: "$(GOOGLE_CLIENT_SECRET)"
        CFBundleURLTypes:
          - CFBundleURLName: Email Address
            CFBundleURLSchemes: [mailto]
            CFBundleTypeRole: Editor
    entitlements:
      path: App/Swiftmail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swiftmail.Swiftmail
        PRODUCT_NAME: Swiftmail
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Swiftmail:
    build:
      targets:
        Swiftmail: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: SwiftmailCore/SwiftmailCoreTests
