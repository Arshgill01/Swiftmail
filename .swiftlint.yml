excluded:
  - .build
  - Packages/SwiftmailCore/.build
disabled_rules:
  - trailing_comma
  - opening_brace
  - todo
  - nesting
  - function_parameter_count
  - cyclomatic_complexity
  - large_tuple
  - identifier_name
  - type_name
  - multiple_closures_with_trailing_closure
  - for_where
  - void_function_in_ternary
  - statement_position
  - optional_data_string_conversion
opt_in_rules:
  - force_unwrapping
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 450
  error: 600
type_body_length:
  warning: 350
  error: 500
function_body_length:
  warning: 80
  error: 120
force_try: error
force_cast: error
force_unwrapping: error
